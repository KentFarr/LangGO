services:
  langgo:
    build:
      context: .
      # Read from the repo-root .env (see frontend/.env.example for the variable list).
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    ports:
      - "3001:5000"
    env_file:
      - ./backend/.env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account
    secrets:
      - firebase-service-account
    restart: unless-stopped

secrets:
  firebase-service-account:
    file: ${FIREBASE_SERVICE_ACCOUNT_FILE:-./backend/config/service-account.json}
