services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: langgo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-langgo}
      POSTGRES_DB: langgo
    volumes:
      - pgdata:/var/lib/postgresql
    # Only for `npm run dev` on the host (the app container uses the internal network).
    # Localhost-only, and 5433 by default to avoid clashing with a locally installed Postgres.
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgo -d langgo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:5000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://langgo:${POSTGRES_PASSWORD:-langgo}@db:5432/langgo
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:3001}
    restart: unless-stopped

volumes:
  pgdata:
