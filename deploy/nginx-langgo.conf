# nginx site for LangGo on a host that already runs nginx for other sites, with HTTPS from
# Let's Encrypt via certbot. The app container listens on 127.0.0.1:8082 (APP_PORT in .env).
#
# 1. Point DNS for langgo.co and www.langgo.co at this server.
# 2. Install this HTTP-only site:
#      sudo cp deploy/nginx-langgo.conf /etc/nginx/sites-available/langgo.co
#      sudo ln -s /etc/nginx/sites-available/langgo.co /etc/nginx/sites-enabled/langgo.co
#      sudo nginx -t && sudo systemctl reload nginx
# 3. Let certbot add HTTPS and the HTTP -> HTTPS redirect to both server blocks:
#      sudo certbot --nginx -d langgo.co -d www.langgo.co
#
# For a domain proxied by Cloudflare, use nginx-langgo-cloudflare.conf instead.

# www redirects to the main domain: sign-in only accepts requests from https://langgo.co.
server {
    listen 80;
    listen [::]:80;
    server_name www.langgo.co;
    return 301 https://langgo.co$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name langgo.co;

    # API bodies are small JSON; uploads are read in the browser, never sent here.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass         http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Generating a batch of cards with OpenAI can take a while.
        proxy_read_timeout 120s;
    }
}
