# Variant of nginx-langgo.conf for a domain proxied by Cloudflare (orange cloud), using a
# Cloudflare Origin Certificate instead of Let's Encrypt.
# The app container listens on 127.0.0.1:8082 (APP_PORT in .env).
#
# Install:
#   sudo cp deploy/nginx-langgo-cloudflare.conf /etc/nginx/sites-available/langgo.co
#   sudo ln -s /etc/nginx/sites-available/langgo.co /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: this uses a Cloudflare Origin Certificate for the langgo.co zone, kept in its own
# directory so it doesn't overwrite other zones' certificates (e.g. kuu.gg's
# /etc/ssl/cloudflare/origin.crt). If the domain is NOT proxied by Cloudflare, use
# Let's Encrypt instead with deploy/nginx-langgo.conf.
#
# Behind Cloudflare (orange cloud) set TRUST_PROXY_HOPS=2 in .env (Cloudflare + nginx);
# without Cloudflare, TRUST_PROXY_HOPS=1.

server {
    listen 80;
    listen [::]:80;
    server_name langgo.co www.langgo.co;
    return 301 https://langgo.co$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.langgo.co;

    ssl_certificate     /etc/ssl/cloudflare/langgo.co/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/langgo.co/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://langgo.co$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name langgo.co;

    ssl_certificate     /etc/ssl/cloudflare/langgo.co/origin.crt;
    ssl_certificate_key /etc/ssl/cloudflare/langgo.co/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # API bodies are small JSON; uploads are read in the browser, never sent here.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass         http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Generating a batch of cards with OpenAI can take a while.
        proxy_read_timeout 120s;
    }
}
